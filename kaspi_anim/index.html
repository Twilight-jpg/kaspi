<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
   <!-- Задаем серый цвет статуса для всех типов Android Webview -->
  <meta name="theme-color" content="#6c6d70">
  <meta name="msapplication-navbutton-color" content="#6c6d70">
  <meta name="apple-mobile-web-app-status-bar-style" content="#6c6d70">
  <title>Avtobys Payment Replica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:  Calibri  !important;
    }
    body {
      background-color: #6c6c70; /* Светлее серый фон, как в приложении */
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* ЗАДНИЙ ПЛАН (Слегка приглушенный) */
    .bg-back-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 36px;
      z-index: 1;
      /* Легкое затемнение только для верхних элементов */
      opacity: 1; 
      filter: brightness(0.85);
    }

    .bg-title {
      font-size: 16px;
      font-weight: 550;
      color: #000000;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    /* ЗЕЛЕНЫЙ КРУГ С ГАЛОЧКОЙ */
    .success-circle {
      width: 55px;
      height: 55px;
      background-color:#347230;
      border-radius: 50%;
      margin-top: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-circle svg {
      width: 32px;
      height: 32px;
      stroke: #a0a0a0;
      stroke-width: 2.8;
      stroke-linecap: square;
      stroke-linejoin: square;
      fill: none;
    }

    /* БЕЛАЯ ШТОРКА */
    .sheet {
      position: absolute;
      top: 147px; /* Чуть перекрывает круг */
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      padding: 10px 22px 24px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.2);
    }

    .handle {
      width: 30px;
      height: 4px;
      background-color: #d1d1d6;
      border-radius: 2px;
      margin-bottom: 14px;
    }

    .sheet-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .sheet-title {
      font-size: 20px;
      font-weight: 700;
      margin-left: -6px;
      color: #000000;
      line-height: 1.25;
      letter-spacing: -0.3px;
    }

    .close-icon {
      width: 20px;
      height: 20px;
      stroke: #000000;
      stroke-width: 2.2;
      cursor: pointer;
      margin-top: 4px;
    }

    /* QR-КОД */
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }

    .qr-image {
      width: 180px;
      height: 210px;
      object-fit: contain;
    }

    .qr-subtext {
      font-size: 16px;
      color: #8e8e93;
      margin-top: 17px;
      font-weight: 400;
    }

    /* ИНФОРМАЦИЯ */
    .info-block {
      text-align: center;
      color: #000000;
    }

    /* НЕ ЖИРНЫЙ КОД АВТОБУСА */
    .info-code {
      font-size: 16px;
      font-weight: 400; /* Не жирный */
      margin-bottom: 5px;
      margin-top: 15px;
    }

    .info-date {
      font-size: 14px;
      color: #000000;
      margin-bottom: 4px;
      margin-top: 15px;
    }

    .info-price {
      font-size: 15px;
      font-weight: 400;
      color: #000000;
      margin-top: -5px;
      margin-left: 7px;
    }

    /* КНОПКИ ДЕЙСТВИЙ */
    .action-icon-img {
     width: 28px;
     height: 28px;
     object-fit: contain; /* Не дает картинке сплющиваться */
     display: block;
   }
    .actions-bar {
     width: 100%;
     max-width: 260px;
     margin-top: auto;
     display: flex;
     justify-content: space-around;
     padding-bottom: -18px;
    }

    .action-btn {
     display: flex;
     flex-direction: column;
     align-items: center;
     gap: 15px;
     cursor: pointer;
    }

    .action-icon {
      width: 28px;
      height: 28px;
    }

    .action-label {
     font-size: 13px;
     color: #000000;
     font-weight: 400;
    }
  </style>
</head>
<body>

  <!-- ВЕРХНИЙ СЛОЙ С ЗАТЕМНЕНИЕМ ТОЛЬКО НА ЭЛЕМЕНТАХ -->
  <div class="bg-back-layer">
    <div class="bg-title">Билет Avtobys. Оплата проезда</div>
    <div class="success-circle">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
  </div>

  <!-- БЕЛАЯ ШТОРКА -->
  <div class="sheet">
    <div class="handle"></div>

    <div class="sheet-header">
      <div class="sheet-title">Билет Avtobys. Оплата<br>проезда</div>
      <svg class="close-icon" viewBox="0 0 24 24" fill="none">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>

    <!-- QR КОД -->
        <div class="qr-container" onclick="openSettings()">
          <img class="qr-image" src="QR.png" alt="QR Code">
          <div class="qr-subtext">Покажите QR-код контролеру</div>
        </div>

        <!-- ИНФОРМАЦИЯ -->
        <div class="info-block">
          <div class="info-code" id="bus-code">281AW06</div>
          <div class="info-date" id="date-time">16 сентября 2026 22:07</div>
          <div class="info-price">Сумма 80 ₸</div>
        </div>

    <!-- НИЖНИЕ КНОПКИ -->
    <div class="actions-bar">
      <div class="action-btn">
        <img src="Receipt.png" class="action-icon-img" alt="Квитанция">
        <span class="action-label">Квитанция</span>
      </div>

      <div class="action-btn">
        <svg class="action-icon" viewBox="0 0 32 32" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="23" cy="8" r="3"/>
          <circle cx="9" cy="16" r="3"/>
          <circle cx="23" cy="24" r="3"/>
          <line x1="11.8" y1="17.6" x2="20.2" y2="22.4"/>
          <line x1="20.2" y1="9.6" x2="11.8" y2="14.4"/>
        </svg>
        <span class="action-label">Поделиться</span>
      </div>
    </div>
    </div>
  <!-- Скрытое окно настроек -->
<div id="settings-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
  <div style="background: #fff; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; color: #000; font-family: sans-serif;">
    <h3 style="margin-bottom: 15px; font-size: 16px; text-align: center;">Редактировать данные</h3>
    
    <label style="font-size: 12px; color: #666;">Код автобуса:</label>
    <input type="text" id="input-bus-code" style="width: 100%; padding: 8px; margin: 4px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
    
    <label style="font-size: 12px; color: #666;">Дата и время:</label>
    <input type="text" id="input-date-time" style="width: 100%; padding: 8px; margin: 4px 0 18px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
    
    <div style="display: flex; gap: 10px;">
      <button onclick="autoSetCurrentTime()" style="flex: 1; padding: 10px; background: #e0e0e0; border: none; border-radius: 6px; font-size: 12px; font-weight: bold;">Текущее время</button>
      <button onclick="saveSettings()" style="flex: 1; padding: 10px; background: #265922; color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: bold;">Сохранить</button>
    </div>
  </div>
</div>
  </body>
  </html>
