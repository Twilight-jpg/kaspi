<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Avtobys Payment Replica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Calibri, sans-serif !important;
    }
    body {
      background-color: #ffffff;
      height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* ОСНОВНОЙ ЭКРАН (УСПЕШНЫЙ ПЛАТЕЖ) */
    .main-screen {
      width: 100%;
      max-width: 420px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-title {
      font-size: 16px;
      font-weight: 550;
      color: #000000;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .main-success-circle {
      width: 65px;
      height: 65px;
      background-color: #00b018;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .main-success-circle svg {
      width: 38px;
      height: 38px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
    }

    .payment-status {
      font-size: 22px;
      font-weight: 600;
      color: #000;
      margin-bottom: 8px;
    }

    .payment-amount {
      font-size: 36px;
      font-weight: 700;
      color: #000;
      margin-bottom: 30px;
    }

    /* КНОПКА ПОКАЗАТЬ БИЛЕТ */
    .ticket-btn {
      width: 100%;
      background: #f8f8f8;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      margin-bottom: 20px;
      border: 1px solid #eaeaea;
    }

    .ticket-btn-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ticket-btn-icon {
      width: 24px;
      height: 24px;
    }

    .ticket-btn-title {
      font-size: 16px;
      font-weight: 500;
      color: #000;
    }

    .ticket-btn-subtitle {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 2px;
    }

    .arrow-icon {
      width: 16px;
      height: 16px;
      stroke: #8e8e93;
      stroke-width: 2;
      fill: none;
    }

    /* СТАТИЧНЫЙ БЛОК "ВАС МОГУТ ЗАИНТЕРЕСОВАТЬ" */
    .ads-block {
      width: 100%;
      border-top: 1px solid #f0f0f0;
      padding-top: 15px;
      margin-bottom: 70px;
    }

    .ads-title {
      font-size: 16px;
      font-weight: 600;
      color: #000;
      margin-bottom: 12px;
    }

    .ads-image {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    .bottom-btn {
      position: fixed;
      bottom: 15px;
      width: calc(100% - 32px);
      max-width: 388px;
      background: #0066ff;
      color: #fff;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(0,102,255,0.2);
    }

    /* ЗАДНИЙ ФОН ПРИ ОТКРЫТОЙ ШТОРКЕ */
    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(108, 108, 112, 1);
      z-index: 100;
    }

    .bg-back-layer {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 36px;
      z-index: 101;
      filter: brightness(0.85);
    }

    .bg-title {
      font-size: 16px;
      font-weight: 550;
      color: #000000;
      margin-bottom: 20px;
    }

    .success-circle {
      width: 55px;
      height: 55px;
      background-color: #347230;
      border-radius: 50%;
      margin-top: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-circle svg {
      width: 32px;
      height: 32px;
      stroke: #a0a0a0;
      stroke-width: 2.8;
      fill: none;
    }

    /* БЕЛАЯ ШТОРКА С QR */
    .sheet {
      position: fixed;
      top: 147px;
      left: 0; right: 0; bottom: 0;
      background: #ffffff;
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      padding: 10px 22px 24px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 102;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.2);
    }

    .handle {
      width: 30px;
      height: 4px;
      background-color: #d1d1d6;
      border-radius: 2px;
      margin-bottom: 14px;
    }

    .sheet-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .sheet-title {
      font-size: 20px;
      font-weight: 700;
      color: #000000;
      line-height: 1.25;
    }

    .close-icon {
      width: 22px;
      height: 22px;
      stroke: #000000;
      stroke-width: 2.2;
      cursor: pointer;
      margin-top: 4px;
    }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .qr-image {
      width: 180px;
      height: 210px;
      object-fit: contain;
    }

    .qr-subtext {
      font-size: 16px;
      color: #8e8e93;
      margin-top: 17px;
    }

    .info-block { text-align: center; color: #000; }
    .info-code { font-size: 16px; margin-top: 15px; outline: none; }
    .info-date { font-size: 14px; margin-top: 15px; outline: none; }
    .info-price { font-size: 15px; margin-top: -5px; }

    .action-icon-img { width: 28px; height: 28px; object-fit: contain; }
    .actions-bar {
      width: 100%; max-width: 260px;
      margin-top: auto; display: flex; justify-content: space-around;
    }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 15px; }
  </style>
</head>
<body>

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <div class="main-screen">
    <div class="main-title">Билет Avtobys. Оплата проезда</div>
    
    <div class="main-success-circle">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <div class="payment-status">Ваш платеж принят.</div>
    <div class="payment-amount">80 ₸</div>

    <!-- КНОПКА ОТКРЫТИЯ ШТОРКИ -->
    <div class="ticket-btn" onclick="openTicket()">
      <div class="ticket-btn-left">
        <svg class="ticket-btn-icon" viewBox="0 0 24 24" fill="none" stroke="#e53935" stroke-width="2">
          <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          <line x1="8" y1="8" x2="16" y2="8"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
          <line x1="8" y1="16" x2="12" y2="16"></line>
        </svg>
        <div>
          <div class="ticket-btn-title">Показать билет</div>
          <div class="ticket-btn-subtitle">Сохранен в истории</div>
        </div>
      </div>
      <svg class="arrow-icon" viewBox="0 0 24 24">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </div>

    <!-- БЛОК С КАРТИНКОЙ РЕКЛАМЫ/ТОВАРОВ -->
    <div class="ads-block">
      <div class="ads-title">Вас могут заинтересовать</div>
      <img src="ads.png" alt="Вас могут заинтересовать" class="ads-image">
    </div>

    <div class="bottom-btn">Вернуться в Платежи</div>
  </div>

  <!-- ВСПЛЫВАЮЩИЙ СЛОЙ С БИЛЕТОМИ И QR -->
  <div id="ticket-modal" class="overlay">
    <div class="bg-back-layer">
      <div class="bg-title">Билет Avtobys. Оплата проезда</div>
      <div class="success-circle">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
    </div>

    <div class="sheet">
      <div class="handle"></div>

      <div class="sheet-header">
        <div class="sheet-title">Билет Avtobys. Оплата<br>проезда</div>
        <!-- КРЕСТИК (ЗАКРЫВАЕТ ШТОРКУ) -->
        <svg class="close-icon" viewBox="0 0 24 24" fill="none" onclick="closeTicket()">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>

      <div class="qr-container" onclick="openSettings()">
        <img class="qr-image" src="QR.png" alt="QR Code">
        <div class="qr-subtext">Покажите QR-код контролеру</div>
      </div>

      <div class="info-block">
        <div class="info-code" id="bus-code" contenteditable="true">281AW06</div>
        <div class="info-date" id="date-time" contenteditable="true">16 сентября 2026 22:07</div>
        <div class="info-price">Сумма 80 ₸</div>
      </div>

      <div class="actions-bar">
        <div class="action-btn">
          <img src="Receipt.png" class="action-icon-img" alt="Квитанция">
          <span style="font-size: 13px;">Квитанция</span>
        </div>
        <div class="action-btn">
          <svg style="width:28px;height:28px;" viewBox="0 0 32 32" fill="none" stroke="#000" stroke-width="2">
            <circle cx="23" cy="8" r="3"/><circle cx="9" cy="16" r="3"/><circle cx="23" cy="24" r="3"/>
            <line x1="11.8" y1="17.6" x2="20.2" y2="22.4"/><line x1="20.2" y1="9.6" x2="11.8" y2="14.4"/>
          </svg>
          <span style="font-size: 13px;">Поделиться</span>
        </div>
      </div>
    </div>
  </div>

  <!-- СКРИПТ УПРАВЛЕНИЯ -->
  <script>
    function openTicket() {
      document.getElementById("ticket-modal").style.display = "block";
    }

    function closeTicket() {
      document.getElementById("ticket-modal").style.display = "none";
    }
  </script>
</body>
</html>
