<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Настройки для прозрачности и светлого фона статус-бара -->
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Avtobys Payment Replica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Calibri, sans-serif !important;
    }
    html {
      background-color: #ffffff;
      height: 100%;
    }
    body {
      background-color: #ffffff;
      min-height: 100vh;
      /* Растягиваем контент под прозрачный статус-бар и нижнюю панель жестов iOS/Android */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* ФИКСИРОВАННАЯ ШАПКА C ПРАВИЛЬНЫМ ОТСТУПОМ */
    .static-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 35px;
      padding-bottom: 15px;
      background: #ffffff;
      z-index: 1;
    }

    .main-title {
      font-size: 16px;
      font-weight: 550;
      color: #000000;
      margin-bottom: 25px;
    }

    .main-success-circle {
      width: 65px;
      height: 65px;
      background-color: #00b018;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-success-circle svg {
      width: 38px;
      height: 38px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
    }

    /* ОСНОВНОЙ КОНТЕНТ */
    .main-screen {
      width: 100%;
      max-width: 420px;
      padding: 10px 18px calc(80px + env(safe-area-inset-bottom)) 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .payment-status {
      font-size: 22px;
      font-weight: 600;
      color: #000;
      margin-bottom: 8px;
      margin-top: 5px;
    }

    .payment-amount {
      font-size: 36px;
      font-weight: 700;
      color: #000;
      margin-bottom: 30px;
    }

    /* КНОПКА ПОКАЗАТЬ БИЛЕТ */
    .ticket-btn {
      width: 100%;
      background: #f8f8f8;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      margin-bottom: 20px;
      border: 1px solid #eaeaea;
    }

    .ticket-btn-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ticket-btn-icon { width: 24px; height: 24px; }
    .ticket-btn-title { font-size: 16px; font-weight: 500; color: #000; }
    .ticket-btn-subtitle { font-size: 12px; color: #8e8e93; margin-top: 2px; }
    .arrow-icon { width: 16px; height: 16px; stroke: #8e8e93; stroke-width: 2; fill: none; }

    /* БЛОК "ВАС МОГУТ ЗАИНТЕРЕСОВАТЬ" */
    .ads-block {
      width: 100%;
      border-top: 1px solid #f0f0f0;
      padding-top: 15px;
      margin-bottom: 20px;
    }

    .ads-title { font-size: 16px; font-weight: 600; color: #000; margin-bottom: 12px; }
    .ads-image { width: 100%; border-radius: 8px; display: block; }

    /* НИЖНЯЯ КНОПКА C УЧЕТОМ ЖЕСТОВОЙ ПАНЕЛИ IPHONE/ANDROID */
    .bottom-btn {
      position: fixed;
      bottom: calc(15px + env(safe-area-inset-bottom));
      width: calc(100% - 32px);
      max-width: 388px;
      background: #0066ff;
      color: #fff;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(0,102,255,0.2);
      z-index: 5;
    }

    /* ФОН ПРИ ОТКРЫТОМ БИЛЕТЕ */
    .backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ШТОРКА (Выезжает снизу) */
    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: calc(77vh + env(safe-area-inset-bottom));
      background: #ffffff;
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      padding: 12px 22px calc(24px + env(safe-area-inset-bottom)) 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 101;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.15);
      
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .backdrop.active .sheet {
      transform: translateY(0);
    }

    .handle {
      width: 32px;
      height: 4px;
      background-color: #d1d1d6;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .sheet-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 35px;
    }

    .sheet-title {
      font-size: 20px;
      font-weight: 700;
      color: #000000;
      line-height: 1.25;
    }

    .close-icon {
      width: 22px;
      height: 22px;
      stroke: #000000;
      stroke-width: 2.2;
      cursor: pointer;
      margin-top: 10px;
    }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .qr-image {
      width: 190px; /* В оригинале занимает ~68% ширины шторки */
      max-width: 240px;
      height: auto;
      aspect-ratio: 1 / 1;
      display: block;
      margin: 0 auto;
    }

    .qr-subtext {
      font-size: 16px;
      color: #8e8e93;
      margin-top: 35px;
      margin-bottom: 10px;
    }

    .info-block { text-align: center; margin-bottom: 40px; color: #000; }
    .info-code { font-size: 16px; margin-top: 2px; font-weight: 700; outline: none; }
    .info-date { font-size: 16px; margin-top: 18px; outline: none; }
    .info-price { font-size: 16px; margin-top: 2px; }

    .action-icon-img { width: 28px; height: 28px; object-fit: contain; }
    .actions-bar {
      width: 100%; max-width: 260px;
      margin-top: auto; display: flex; justify-content: space-around;
      padding-bottom: 4px;
    }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 10px; }

    #settings-modal input {
      -webkit-user-select: text !important;
      user-select: text !important;
    }
  </style>
</head>
<body>

  <!-- ВЕРХНЯЯ ШАПКА -->
  <div class="static-header">
    <div class="main-title">Билет Avtobys. Оплата проезда</div>
    <div class="main-success-circle">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
  </div>

  <!-- ОСНОВНОЙ ЭКРАН -->
  <div class="main-screen">
    <div class="payment-status">Ваш платеж принят.</div>
    <div class="payment-amount">80 ₸</div>

    <!-- КНОПКА ПОКАЗАТЬ БИЛЕТ -->
    <div class="ticket-btn" onclick="openTicket()">
      <div class="ticket-btn-left">
        <svg class="ticket-btn-icon" viewBox="0 0 24 24" fill="none" stroke="#e53935" stroke-width="2">
          <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          <line x1="8" y1="8" x2="16" y2="8"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
          <line x1="8" y1="16" x2="12" y2="16"></line>
        </svg>
        <div>
          <div class="ticket-btn-title">Показать билет</div>
          <div class="ticket-btn-subtitle">Сохранен в истории</div>
        </div>
      </div>
      <svg class="arrow-icon" viewBox="0 0 24 24">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </div>

    <!-- БЛОК С РЕКЛАМОЙ -->
    <div class="ads-block">
      <div class="ads-title">Вас могут заинтересовать</div>
      <img src="ads.png" alt="Вас могут заинтересовать" class="ads-image">
    </div>

    <div class="bottom-btn">Вернуться в Платежи</div>
  </div>

  <!-- ВЫЕЗЖАЮЩАЯ ШТОРКА -->
  <div id="backdrop" class="backdrop" onclick="closeTicket()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="handle"></div>

      <div class="sheet-header">
        <div class="sheet-title">Билет Avtobys. Оплата<br>проезда</div>
        <svg class="close-icon" viewBox="0 0 24 24" fill="none" onclick="closeTicket()">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>

      <div class="qr-container" onclick="openSettings()">
        <img class="qr-image" src="QR.png" alt="QR Code">
        <div class="qr-subtext">Покажите QR-код контролеру</div>
      </div>

      <div class="info-block">
        <div class="info-code" id="bus-code" contenteditable="true">281AW06</div>
        <div class="info-date" id="date-time" contenteditable="true">18 сентября 2026 22:07</div>
        <div class="info-price">Сумма 80 ₸</div>
      </div>

      <div class="actions-bar">
        <div class="action-btn">
          <img src="Receipt.png" class="action-icon-img" alt="Квитанция">
          <span style="font-size: 13px;">Квитанция</span>
        </div>
        <div class="action-btn">
          <svg style="width:28px;height:28px;" viewBox="0 0 32 32" fill="none" stroke="#000" stroke-width="2">
            <circle cx="23" cy="8" r="3"/><circle cx="9" cy="16" r="3"/><circle cx="23" cy="24" r="3"/>
            <line x1="11.8" y1="17.6" x2="20.2" y2="22.4"/><line x1="20.2" y1="9.6" x2="11.8" y2="14.4"/>
          </svg>
          <span style="font-size: 13px;">Поделиться</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ОКНО НАСТРОЕК (По клику на QR) -->
  <div id="settings-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: #fff; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; color: #000;">
      <h3 style="margin-bottom: 15px; font-size: 16px; text-align: center;">Редактировать данные</h3>
      
      <label style="font-size: 12px; color: #666;">Код автобуса / госномер:</label>
      <input type="text" id="input-bus-code" style="width: 100%; padding: 10px; margin: 4px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;">
      
      <label style="font-size: 12px; color: #666;">Дата и время:</label>
      <input type="text" id="input-date-time" style="width: 100%; padding: 10px; margin: 4px 0 18px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;">
      
      <div style="display: flex; gap: 10px;">
        <button onclick="autoSetCurrentTime()" style="flex: 1; padding: 10px; background: #e0e0e0; border: none; border-radius: 6px; font-size: 12px; font-weight: bold;">Текущее время</button>
        <button onclick="saveSettings()" style="flex: 1; padding: 10px; background: #265922; color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: bold;">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

    document.addEventListener("DOMContentLoaded", () => {
      const savedCode = localStorage.getItem("bus_code");
      const savedDate = localStorage.getItem("bus_date");

      if (savedCode) document.getElementById("bus-code").innerText = savedCode;
      if (savedDate) document.getElementById("date-time").innerText = savedDate;
    });

    function openTicket() {
      document.getElementById("backdrop").classList.add("active");
    }

    function closeTicket() {
      document.getElementById("backdrop").classList.remove("active");
    }

    function openSettings() {
      document.getElementById("input-bus-code").value = document.getElementById("bus-code").innerText;
      document.getElementById("input-date-time").value = document.getElementById("date-time").innerText;
      document.getElementById("settings-modal").style.display = "flex";
    }

    function saveSettings() {
      const newCode = document.getElementById("input-bus-code").value;
      const newDate = document.getElementById("input-date-time").value;

      document.getElementById("bus-code").innerText = newCode;
      document.getElementById("date-time").innerText = newDate;

      localStorage.setItem("bus_code", newCode);
      localStorage.setItem("bus_date", newDate);

      document.getElementById("settings-modal").style.display = "none";
    }

    function autoSetCurrentTime() {
      const now = new Date();
      const day = now.getDate();
      const month = months[now.getMonth()];
      const year = now.getFullYear();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      document.getElementById("input-date-time").value = `${day} ${month} ${year} ${hours}:${minutes}`;
    }
  </script>
</body>
</html>
